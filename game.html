<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklist Operative – Spiel</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05080b;color:#fff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading p{color:#aeb9be}
  </style>
</head>
<body>
  <div class="loading"><div><h1>BLACKLIST OPERATIVE</h1><p>Spiel wird geladen …</p></div></div>
  <script>
    const source = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/https:/Blacklist.com';

    fetch(source, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Spiel konnte nicht geladen werden.');
        return response.text();
      })
      .then(html => {
        let fixedHtml = html
          .replace(
            "  FAUSTE:{name:\"FÄUSTE\",cost:100,req:1,mag:0,reserve:0,damage:999,cooldown:.38,speed:0,pellets:1,spread:0,desc:\"Nahkampf. Schnelle Schläge und zufällige Finisher.\",melee:true},[...]",
            "  FAUSTE:{name:\"FÄUSTE\",cost:100,req:1,mag:0,reserve:0,damage:10,cooldown:.38,speed:0,pellets:1,spread:0,desc:\"Nahkampf. Schnelle Schläge und zufällige Finisher.\",melee:true},\[...]"
          )
          .replace(
            "        if(b.specialType && ownedSpecialAmmo.includes(b.specialType) && !e.specialEffectStarted){\n          e.hp=0;\n          e.specialType=b.specialType;\n        }",
            "        if(b.specialType && ownedSpecialAmmo.includes(b.specialType) && !e.specialEffectStarted){\n          const specialDamage = Math.max(10, Number(b.damage) || 10);\n          e.hp=Math.max(0,e.hp-specialDamage);\n          e.specialType=b.specialType;\n        }"
          );

        // Spezialmunition deaktivieren.
        fixedHtml = fixedHtml.replace(
          /const\\s+specialAmmoCatalog\\s*=\\s*\\{[\\s\\S]*?\\};/,
          'const specialAmmoCatalog={};'
        );

        // Nahkampf-Einträge aus dem Waffen-Katalog entfernen.
        fixedHtml = fixedHtml.replace(
          /\\s*[A-Z0-9_-]+:\\{[^{}]*?melee:true[^{}]*?\\},?/g,
          ''
        );

        // PAD AI als Overlay einfügen.
        const padAiScript = '<script src="./pad-ai.js"><\\/script>';
        const withPadAi = fixedHtml.includes('pad-ai.js')
          ? fixedHtml
          : fixedHtml.replace('</body>', `${padAiScript}</body>`);

        document.open();
        document.write(withPadAi);
        document.close();
      })
      .catch(error => {
        document.querySelector('.loading').innerHTML = '<div><h1>Laden fehlgeschlagen</h1><p>Das Spiel konnte nicht geladen werden.</p></div>';
        console.error(error);
      });
  </script>
</body>
</html>
