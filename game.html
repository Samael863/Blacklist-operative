<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklist Operative – Spiel</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05080b;color:#fff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading p{color:#aeb9be}
  </style>
</head>
<body>
  <div class="loading"><div><h1>BLACKLIST OPERATIVE</h1><p>Spiel wird geladen …</p></div></div>
  <script>
    const source = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/https:/Blacklist.com';
    const padAiSource = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/pad-ai.js';

    fetch(source, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Spiel konnte nicht geladen werden.');
        return response.text();
      })
      .then(html => {
        // Die KI wird direkt in den eigentlichen Spiel-HTML-Code eingesetzt.
        // Dadurch bleibt die öffentliche Spiele-Adresse unverändert.
        const injection = `
<style id="pad-ai-fallback-style">
#padAiToggle{position:fixed!important;right:62px!important;top:10px!important;z-index:2147483647!important;padding:9px 12px!important;border-radius:10px!important;background:#101418!important;color:#fff!important;border:1px solid #00d9ff!important;font:700 13px Arial!important;cursor:pointer!important;display:block!important}
#padAiMic{position:fixed!important;right:10px!important;top:10px!important;z-index:2147483647!important;padding:9px 12px!important;border-radius:10px!important;background:#101418!important;color:#fff!important;border:1px solid #59636a!important;font:700 16px Arial!important;cursor:pointer!important;display:none}
</style>
<script src="${padAiSource}"><\\/script>`;
        const bodyEnd = /<\\/body\\s*>/i;
        html = bodyEnd.test(html) ? html.replace(bodyEnd, injection + '</body>') : html + injection;
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error => {
        document.querySelector('.loading').innerHTML = '<div><h1>Laden fehlgeschlagen</h1><p>Bitte die Seite neu laden oder den direkten GitHub-Link öffnen.</p></div>';
        console.error(error);
      });
  </script>
</body>
</html>
