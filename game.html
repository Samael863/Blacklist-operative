<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklist Operative – Spiel</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05080b;color:#fff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading p{color:#aeb9be}
  </style>
</head>
<body>
  <div class="loading"><div><h1>BLACKLIST OPERATIVE</h1><p>Spiel wird geladen …</p></div></div>
  <script>
    const gameSource = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/https:/Blacklist.com';
    const aiSource = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/pad-ai.js';

    fetch(gameSource, { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('Spiel konnte nicht geladen werden.');
        return response.text();
      })
      .then(gameHtml => {
        const parser = new DOMParser();
        const gameDocument = parser.parseFromString(gameHtml, 'text/html');
        const aiScript = gameDocument.createElement('script');
        aiScript.src = aiSource + '?v=1';
        aiScript.async = false;
        gameDocument.body.appendChild(aiScript);

        document.open();
        document.write('<!doctype html>' + gameDocument.documentElement.outerHTML);
        document.close();
      })
      .catch(error => {
        document.querySelector('.loading').innerHTML = '<div><h1>Laden fehlgeschlagen</h1><p>Das Spiel konnte nicht geladen werden.</p></div>';
        console.error(error);
      });
  </script>
</body>
</html>
