<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blacklist Operative – Spiel</title>
  <style>
    html,body{margin:0;min-height:100%;background:#05080b;color:#fff;font-family:Arial,sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .loading p{color:#aeb9be}
  </style>
</head>
<body>
  <div class="loading"><div><h1>BLACKLIST OPERATIVE</h1><p>Spiel wird geladen …</p></div></div>
  <script>
    const gameSource = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/https:/Blacklist.com';
    const aiSource = 'https://raw.githubusercontent.com/Samael863/Blacklist-operative/main/pad-ai.js';

    Promise.all([
      fetch(gameSource, {cache:'no-store'}).then(r => {
        if (!r.ok) throw new Error('Spiel konnte nicht geladen werden.');
        return r.text();
      }),
      fetch(aiSource, {cache:'no-store'}).then(r => {
        if (!r.ok) throw new Error('PAD AI konnte nicht geladen werden.');
        return r.text();
      })
    ])
    .then(([gameHtml, aiCode]) => {
      // PAD AI wird als Inline-Script in das vollständige Spiel eingesetzt.
      // Dadurch funktioniert der Einbau auch dann, wenn externe Scripts beim
      // document.write-Schritt nicht automatisch ausgeführt werden.
      const aiTag = '<script>\\n' + aiCode.replace(/<\\/script/gi, '<\\\\/script') + '\\n<\\/script>';
      const bodyEnd = /<\\/body\\s*>/i;
      const finalHtml = bodyEnd.test(gameHtml)
        ? gameHtml.replace(bodyEnd, aiTag + '</body>')
        : gameHtml + aiTag;

      document.open();
      document.write(finalHtml);
      document.close();
    })
    .catch(error => {
      document.querySelector('.loading').innerHTML = '<div><h1>Laden fehlgeschlagen</h1><p>' + error.message + '</p></div>';
      console.error(error);
    });
  </script>
</body>
</html>
